name: Build & Deploy to Azure (Docker Hub, SHA Tags)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set Image Tag
      run: |
        echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        
    - name: Build DATABASE_URL
      run: |
       echo "DATABASE_URL=sqlserver://${{secrets.DB_HOST}}:1433;database=${{ secrets.DB_NAME }};user=${{ secrets.DB_USER }};password=${{ secrets.DB_SECURE_PASSWORD }};encrypt=true" >> $GITHUB_ENV
    - name: Build and Push Images
      run: |
        export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
        export AZURE_WEBAPP_NAME=${{ secrets.AZURE_WEBAPP_NAME }}
        export DB_HOST=${{ secrets.DB_HOST }}
        export DB_NAME=${{ secrets.DB_NAME }}
        export DB_USER=${{ secrets.DB_USER }}
        export DB_SECURE_PASSWORD=${{ secrets.DB_SECURE_PASSWORD }}
        export IMAGE_TAG=${{ env.IMAGE_TAG }}
        export DATABASE_URL=${{ env.DATABASE_URL }}
        envsubst < docker-compose.prod.yml > docker-compose.rendered.yml
        docker compose -f docker-compose.prod.yml build
        docker compose -f docker-compose.prod.yml push

    - name: Deploy to Azure
      run: |
        az webapp config container set \
          --name ${{ secrets.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --multicontainer-config-type compose \
          --multicontainer-config-file docker-compose.rendered.yml


        az webapp restart \
          --name ${{ secrets.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
